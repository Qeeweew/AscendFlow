[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascendflow"
version = "0.1.0"
description = "AscendFlow: an Ascend 910B pipeline compiler with automatic synchronization, built on xDSL"
requires-python = ">=3.11"
dependencies = ["xdsl==0.73.0"]

[project.optional-dependencies]
validation = ["numpy>=2,<3"]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[project.scripts]
ascendflow = "ascendflow.cli:main"

[tool.setuptools]
package-dir = { ascendflow = "src" }
packages = [
    "ascendflow",
    "ascendflow.analysis",
    "ascendflow.backend",
    "ascendflow.dialects",
    "ascendflow.frontend",
    "ascendflow.passes",
    "ascendflow.runtime",
    "ascendflow.target",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["ascendflow", "benchmarks", "examples", "tests"]
