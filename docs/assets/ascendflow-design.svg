<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="686" viewBox="0 0 1200 686" role="img" aria-labelledby="title desc">
  <title id="title">AscendFlow: explicit kernels, automatic synchronization</title>
  <desc id="desc">The kernel author specifies computation, memory and stage order in Python DSL. The xDSL compiler derives synchronization from physical accesses, buffer ownership, logical generations and last readers, then emits ASC for CANN and Ascend 910B. An aligned non-causal attention with head dimension 128 illustrates Cube QK/PV, two AIVs for softmax/output, and two-slot Score/P/PV workspace reuse.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
    <marker id="ready-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="release-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b45309"/>
    </marker>
    <style>
      text { font-family: Inter, "DejaVu Sans", sans-serif; fill: #152840; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; }
      .heading { font-size: 23px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; }
      .muted { fill: #52647a; }
      .lane { font-size: 14px; font-weight: 700; }
      .tile { font-size: 15px; font-weight: 700; }
      .tile-sub { font-size: 12px; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="686" rx="20" fill="#f7fafc"/>
  <text x="32" y="48" font-size="30" font-weight="700">AscendFlow</text>
  <text x="32" y="77" font-size="17" class="muted">Explicit computation and scheduling. Synchronization from real memory use.</text>

  <rect x="32" y="108" width="264" height="186" rx="14" fill="#ffffff" stroke="#cdddeb"/>
  <text x="52" y="136" class="eyebrow" style="fill:#2563eb">KERNEL AUTHOR</text>
  <text x="52" y="169" class="heading">Python DSL</text>
  <text x="52" y="199" class="body">Compute + data movement</text>
  <text x="52" y="224" class="body">Tiles, buffers, stage order</text>
  <rect x="52" y="247" width="224" height="28" rx="7" fill="#eff6ff"/>
  <text x="164" y="266" text-anchor="middle" class="small" style="fill:#1d4ed8">GM / UB / L1 / L0</text>

  <path d="M 302 201 H 322" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="334" y="108" width="384" height="186" rx="14" fill="#ffffff" stroke="#9ac8bf"/>
  <text x="354" y="136" class="eyebrow" style="fill:#0f766e">ACCESS + LIFETIME</text>
  <text x="354" y="169" class="heading">xDSL compiler</text>
  <text x="354" y="199" class="body">Physical reads / writes + logical generations</text>
  <text x="354" y="224" class="body">Ownership + every last reader</text>
  <rect x="354" y="247" width="344" height="28" rx="7" fill="#e8f5f0"/>
  <text x="526" y="266" text-anchor="middle" class="small" style="fill:#0f766e">ready / release + finite event resources</text>

  <path d="M 724 201 H 744" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="756" y="108" width="180" height="186" rx="14" fill="#ffffff" stroke="#cdddeb"/>
  <text x="776" y="136" class="eyebrow" style="fill:#6d28d9">CODE GENERATION</text>
  <text x="776" y="169" class="heading">ASC</text>
  <text x="776" y="199" class="body">CANN 9.1</text>
  <text x="776" y="224" class="small muted">Device kernel</text>
  <text x="776" y="246" class="small muted">+ runtime launcher</text>

  <path d="M 942 201 H 962" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="974" y="108" width="194" height="186" rx="14" fill="#ffffff" stroke="#cdddeb"/>
  <text x="994" y="136" class="eyebrow" style="fill:#2563eb">EXECUTION</text>
  <text x="994" y="169" font-size="21" font-weight="700">Ascend 910B</text>
  <rect x="994" y="188" width="154" height="27" rx="6" fill="#eff6ff"/>
  <text x="1071" y="207" text-anchor="middle" class="small">AIC: Cube</text>
  <rect x="994" y="222" width="154" height="27" rx="6" fill="#e8f5f0"/>
  <text x="1071" y="241" text-anchor="middle" class="small">AIV: Vector</text>
  <text x="994" y="275" font-size="12" class="muted">Mixed: 1 AIC + 2 AIV</text>

  <rect x="32" y="318" width="1136" height="336" rx="14" fill="#ffffff" stroke="#d6e2ec"/>
  <text x="52" y="350" font-size="21" font-weight="700">Attention: QK → softmax → PV → output</text>
  <text x="52" y="376" class="body muted">D=128 · 64 query rows/tile · 128 K/V rows · two-slot Score / P / PV in GM</text>
  <text x="1128" y="405" text-anchor="end" class="small muted">issue sequence →</text>
  <text x="52" y="452" class="lane">Cube</text>
  <text x="52" y="474" class="small muted">1 AIC</text>
  <text x="52" y="548" class="lane">Vector</text>
  <text x="52" y="570" class="small muted">2 AIV · 32 rows each</text>
  <rect x="212" y="426" width="112" height="58" rx="8" fill="#eff6ff" stroke="#b7d1fb"/>
  <text x="268" y="450" text-anchor="middle" class="tile" style="fill:#1d4ed8">QK 0</text>
  <text x="268" y="470" text-anchor="middle" class="tile-sub muted">→ Score[0]</text>
  <rect x="340" y="426" width="112" height="58" rx="8" fill="#eff6ff" stroke="#b7d1fb"/>
  <text x="396" y="450" text-anchor="middle" class="tile" style="fill:#1d4ed8">QK 1</text>
  <text x="396" y="470" text-anchor="middle" class="tile-sub muted">→ Score[1]</text>
  <rect x="468" y="426" width="112" height="58" rx="8" fill="#eff6ff" stroke="#b7d1fb"/>
  <text x="524" y="450" text-anchor="middle" class="tile" style="fill:#1d4ed8">PV 0</text>
  <text x="524" y="470" text-anchor="middle" class="tile-sub muted">P[0] × V</text>
  <rect x="596" y="426" width="112" height="58" rx="8" fill="#eff6ff" stroke="#b7d1fb"/>
  <text x="652" y="450" text-anchor="middle" class="tile" style="fill:#1d4ed8">QK 2</text>
  <text x="652" y="470" text-anchor="middle" class="tile-sub muted">→ Score[0]</text>
  <rect x="724" y="426" width="112" height="58" rx="8" fill="#eff6ff" stroke="#b7d1fb"/>
  <text x="780" y="450" text-anchor="middle" class="tile" style="fill:#1d4ed8">PV 1</text>
  <text x="780" y="470" text-anchor="middle" class="tile-sub muted">P[1] × V</text>
  <rect x="852" y="426" width="112" height="58" rx="8" fill="#eff6ff" stroke="#b7d1fb"/>
  <text x="908" y="450" text-anchor="middle" class="tile" style="fill:#1d4ed8">PV 2</text>
  <text x="908" y="470" text-anchor="middle" class="tile-sub muted">P[0] × V</text>
  <rect x="340" y="524" width="112" height="58" rx="8" fill="#e8f5f0" stroke="#a9d5c7"/>
  <text x="396" y="548" text-anchor="middle" class="tile" style="fill:#0f766e">softmax 0</text>
  <text x="396" y="568" text-anchor="middle" class="tile-sub muted">Score[0] → P[0]</text>
  <rect x="468" y="524" width="112" height="58" rx="8" fill="#e8f5f0" stroke="#a9d5c7"/>
  <text x="524" y="548" text-anchor="middle" class="tile" style="fill:#0f766e">softmax 1</text>
  <text x="524" y="568" text-anchor="middle" class="tile-sub muted">Score[1] → P[1]</text>
  <rect x="596" y="524" width="112" height="58" rx="8" fill="#e8f5f0" stroke="#a9d5c7"/>
  <text x="652" y="548" text-anchor="middle" class="tile" style="fill:#0f766e">store 0</text>
  <text x="652" y="568" text-anchor="middle" class="tile-sub muted">PV[0] → O₀</text>
  <rect x="724" y="524" width="112" height="58" rx="8" fill="#e8f5f0" stroke="#a9d5c7"/>
  <text x="780" y="548" text-anchor="middle" class="tile" style="fill:#0f766e">softmax 2</text>
  <text x="780" y="568" text-anchor="middle" class="tile-sub muted">Score[0] → P[0]</text>
  <rect x="852" y="524" width="112" height="58" rx="8" fill="#e8f5f0" stroke="#a9d5c7"/>
  <text x="908" y="548" text-anchor="middle" class="tile" style="fill:#0f766e">store 1</text>
  <text x="908" y="568" text-anchor="middle" class="tile-sub muted">PV[1] → O₁</text>
  <rect x="980" y="524" width="112" height="58" rx="8" fill="#e8f5f0" stroke="#a9d5c7"/>
  <text x="1036" y="548" text-anchor="middle" class="tile" style="fill:#0f766e">store 2</text>
  <text x="1036" y="568" text-anchor="middle" class="tile-sub muted">PV[0] → O₂</text>
  <path d="M 324 455 C 337 455 325 553 338 553" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ready-arrow)"/>
  <path d="M 580 455 C 593 455 581 553 594 553" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ready-arrow)"/>
  <path d="M 396 522 V 503 H 652 V 486" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#release-arrow)"/>
  <circle cx="396" cy="522" r="3" fill="#b45309"/>
  <text x="440" y="498" class="small" style="fill:#b45309">Score[0] release</text>
  <circle cx="59" cy="623" r="4" fill="#2563eb"/>
  <text x="72" y="628" class="small"><tspan font-weight="700">ready</tspan><tspan class="muted">: producer finished → reader may start</tspan></text>
  <circle cx="539" cy="623" r="4" fill="#b45309"/>
  <text x="552" y="628" class="small"><tspan font-weight="700">release</tspan><tspan class="muted">: both AIV GM reads finished → Score slot may be reused</tspan></text>
  <text x="1168" y="675" text-anchor="end" font-size="11" class="muted">Conceptual schedule · columns are not clock cycles · not a profiling trace</text>
</svg>
